# Infrastructure only: cluster-wide operator plus NATS JetStream. DGD, model,
# Frontend, EPP, planner, and serving-worker settings belong to experiments.
global:
  etcd:
    install: false
  nats:
    install: true
  kai-scheduler:
    install: false
    enabled: false
  volcano-scheduler:
    enabled: false
  grove:
    install: false
    enabled: false

dynamo-operator:
  enabled: true
  discoveryBackend: kubernetes
  namespaceRestriction:
    enabled: false
  controllerManager:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: prrw-role
                  operator: In
                  values:
                    - platform
  dynamo:
    istio:
      enabled: false
    serviceMesh:
      enabled: false

nats:
  config:
    cluster:
      enabled: false
    jetstream:
      enabled: true
      fileStore:
        enabled: true
      memoryStore:
        enabled: false
  podTemplate:
    merge:
      spec:
        nodeSelector:
          prrw-role: platform
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
