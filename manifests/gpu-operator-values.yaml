# The preinstalled host driver is verified, and NVIDIA Container Toolkit is
# installed and verified by k8s-cluster-bootstrap.sh before this chart.
operator:
  runtimeClass: nvidia
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: prrw-role
                operator: In
                values:
                  - platform

driver:
  enabled: false

toolkit:
  enabled: false

# Use the host Toolkit's CDI specification. Keep NRI disabled; both native CDI
# GPU requests and the explicit nvidia RuntimeClass are verified by bootstrap.
cdi:
  enabled: true
  nriPluginEnabled: false

# RTX 3090 workers do not use MIG or GPU sharing.
mig:
  strategy: none

# These operands target vGPU, VM passthrough, confidential-computing, or MIG
# workflows and are intentionally absent from this bare-metal RTX 3090 pool.
migManager:
  enabled: false
vgpuDeviceManager:
  enabled: false
vfioManager:
  enabled: false
sandboxWorkloads:
  enabled: false
  defaultWorkload: container
sandboxDevicePlugin:
  enabled: false
kataSandboxDevicePlugin:
  enabled: false
ccManager:
  enabled: false

# NFD workers remain a DaemonSet, while its controllers stay on the platform
# control-plane node.
node-feature-discovery:
  master:
    nodeSelector:
      prrw-role: platform
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  gc:
    nodeSelector:
      prrw-role: platform
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
